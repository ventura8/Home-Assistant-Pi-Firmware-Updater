---
alias: "Apply Pi Firmware and Reboot"
icon: mdi:restart
sequence:
  - action: persistent_notification.dismiss
    data:
      notification_id: "pi_firmware_alert"
  - choose:
      - conditions:
          - condition: state
            entity_id: sensor.pi_firmware_monitor
            state: "Upgrade Blocked"
        sequence:
          - action: persistent_notification.create
            data:
              title: "🚫 Firmware Upgrade Blocked"
              message: "The firmware upgrade was blocked. Reason: {{ state_attr('sensor.pi_firmware_monitor', 'blocked_reason') }}"
              notification_id: "pi_firmware_blocked_alert"
      - conditions:
          - condition: state
            entity_id: sensor.pi_firmware_monitor
            state: "Update Available"
        sequence:
          - action: persistent_notification.dismiss
            data:
              notification_id: "pi_firmware_blocked_alert"
          - action: shell_command.apply_pi_firmware_update
            continue_on_error: true
            response_variable: update_status
          - choose:
              - conditions:
                  - "{{ update_status is defined and update_status.returncode == 0 }}"
                sequence:
                  - action: notify.REPLACE_WITH_YOUR_DEVICE_ID
                    data:
                      message: "Update command sent. The Pi will be offline for ~3 minutes while it reboots."
            default:
              - action: persistent_notification.create
                data:
                  title: "⚠️ Firmware Update Failed"
                  message: "Update execution failed. Check HA OS or rpi-eeprom-update logs for details."
                  notification_id: "pi_firmware_alert"
      - conditions:
          - condition: state
            entity_id: sensor.pi_firmware_monitor
            state: "Up to Date"
        sequence:
          - action: persistent_notification.create
            data:
              title: "✅ Firmware Already Up to Date"
              message: "No update is needed at this time."
              notification_id: "pi_firmware_blocked_alert"
    default:
      - action: persistent_notification.create
        data:
          title: "⚠️ Firmware Upgrade Not Allowed"
          message: "No firmware update is available or system is not ready."
          notification_id: "pi_firmware_blocked_alert"
