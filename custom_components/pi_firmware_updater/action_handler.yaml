- alias: "Pi Firmware: Action Handler"
  id: pi_firmware_action_handler
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: "INSTALL_PI_FIRMWARE"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: sensor.pi_firmware_monitor
              state: "Upgrade Blocked"
          sequence:
            - action: notify.REPLACE_WITH_YOUR_DEVICE_ID
              data:
                message: "Update blocked: {{ state_attr('sensor.pi_firmware_monitor', 'blocked_reason') }}"
        - conditions:
            - condition: state
              entity_id: sensor.pi_firmware_monitor
              state: "Update Available"
          sequence:
            - action: shell_command.apply_pi_firmware_update
              continue_on_error: true
              response_variable: update_status
            - choose:
                - conditions:
                    - "{{ update_status.returncode == 0 }}"
                  sequence:
                    - action: persistent_notification.dismiss
                      data:
                        notification_id: "pi_firmware_alert"
                    - action: notify.REPLACE_WITH_YOUR_DEVICE_ID
                      data:
                        message: "Update command sent. The Pi will be offline for ~3 minutes while it reboots."
              default:
                - action: notify.REPLACE_WITH_YOUR_DEVICE_ID
                  data:
                    message: "Update execution failed. Check HA OS/rpi-eeprom-update logs."
      default:
        - action: notify.REPLACE_WITH_YOUR_DEVICE_ID
          data:
            message: "Update not possible at this time."
