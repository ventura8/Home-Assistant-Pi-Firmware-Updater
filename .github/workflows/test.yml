---
name: Run Tests

'on':
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  lint:
    name: Run Lints
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.10.0"

      - name: Install lint and formatter tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils
          pip install --only-binary :all: yamllint==1.38.0 lizard==1.24.0
          npm install --global --ignore-scripts markdownlint-cli@0.49.1

          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-delay 2 --retry-all-errors \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            -o shellcheck.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-delay 2 --retry-all-errors \
            "https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64" \
            -o shfmt
          sudo mv shfmt /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt

          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-delay 2 --retry-all-errors \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64" \
            -o hadolint-linux-x86_64
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-delay 2 --retry-all-errors \
            "https://github.com/hadolint/hadolint/releases/download/v2.15.1/checksums.sha256" \
            -o checksums.sha256
          awk '/(^|[* ])hadolint-linux-x86_64$/ {print; count++} END {exit count != 1}' \
            checksums.sha256 > hadolint.sha256
          sha256sum -c hadolint.sha256
          sudo mv hadolint-linux-x86_64 /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint

          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-delay 2 --retry-all-errors \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          sudo chmod +x /usr/local/bin/actionlint

      - name: Fix Script Permissions
        run: chmod +x tests/run_tests.sh

      - name: Run Mandatory Lint/Format Suite
        run: ./tests/run_tests.sh lint

  build-and-test:
    name: Build & Test (${{ matrix.base_image }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base_image: ["debian:bookworm-slim", "debian:testing-slim"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.base_image }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.base_image }}-

      - name: Create Sanitized Tag
        id: meta
        run: |
          TAG_NAME=$(echo "${{ matrix.base_image }}" | tr ':' '-')
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          build-args: BASE_IMAGE=${{ matrix.base_image }}
          tags: ha-updater-test:${{ steps.meta.outputs.tag_name }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix to prevent cache growth
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Matrix Tests
        run: |
          mkdir -p "coverage/${{ steps.meta.outputs.tag_name }}"
          docker run --rm \
            -v "${{ github.workspace }}/coverage/${{ steps.meta.outputs.tag_name }}:/app/coverage" \
            ha-updater-test:${{ steps.meta.outputs.tag_name }} \
            /app/tests/run_tests.sh coverage unit
          docker run --rm \
            -v "${{ github.workspace }}/coverage/${{ steps.meta.outputs.tag_name }}:/app/coverage" \
            ha-updater-test:${{ steps.meta.outputs.tag_name }} \
            /app/tests/run_tests.sh coverage component
          docker run --rm \
            -v "${{ github.workspace }}/coverage/${{ steps.meta.outputs.tag_name }}:/app/coverage" \
            ha-updater-test:${{ steps.meta.outputs.tag_name }} \
            /app/tests/run_tests.sh coverage e2e

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ steps.meta.outputs.tag_name }}
          path: coverage/${{ steps.meta.outputs.tag_name }}
          retention-days: 1

      - name: Write Matrix Manifest
        run: |
          mkdir -p coverage-manifest
          cat <<EOF > coverage-manifest/${{ steps.meta.outputs.tag_name }}.json
          {
            "base_image": "${{ matrix.base_image }}",
            "tag_name": "${{ steps.meta.outputs.tag_name }}"
          }
          EOF

      - name: Upload Matrix Manifest
        uses: actions/upload-artifact@v7.0.1
        with:
          name: matrix-manifest-${{ steps.meta.outputs.tag_name }}
          path: coverage-manifest/${{ steps.meta.outputs.tag_name }}.json
          retention-days: 1

  report-coverage:
    name: Merge Coverage & Publish Reports
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Download Matrix Manifests
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: matrix-manifest-*
          path: coverage-manifest
          merge-multiple: true

      - name: Select Merge Image
        id: merge-image
        run: |
          MANIFEST_FILE=$(find coverage-manifest -type f -name '*.json' | sort | head -n1)
          if [ -z "$MANIFEST_FILE" ]; then
            echo "No matrix manifest files found" >&2
            exit 1
          fi

          BASE_IMAGE=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['base_image'])" \
            "$MANIFEST_FILE")
          TAG_NAME=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['tag_name'])" \
            "$MANIFEST_FILE")

          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Cache Docker layers
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.merge-image.outputs.tag_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ steps.merge-image.outputs.tag_name }}-

      - name: Build Merge Image (Cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: tests/Dockerfile
          build-args: BASE_IMAGE=${{ steps.merge-image.outputs.base_image }}
          tags: ha-updater-test:${{ steps.merge-image.outputs.tag_name }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: false

      - name: Merge Coverage
        run: |
          mkdir -p coverage/merged

          MERGE_INPUTS=$(
            find coverage -mindepth 2 -maxdepth 2 -type d \
              \( -name unit -o -name component -o -name e2e \) \
              | sed 's#^coverage#/work/coverage#' \
              | sort \
              | tr '\n' ' '
          )
          if [ -z "$MERGE_INPUTS" ]; then
            echo "No coverage inputs found to merge" >&2
            exit 1
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            ha-updater-test:${{ steps.merge-image.outputs.tag_name }} \
            bash -lc "kcov --merge /work/coverage/merged $MERGE_INPUTS"
          sudo chown -R "$(id -u):$(id -g)" coverage/merged

      - name: Fix Coverage XML
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            ha-updater-test:${{ steps.merge-image.outputs.tag_name }} \
            python3 /work/tests/transform_coverage.py \
            /work/coverage/merged/kcov-merged/cobertura.xml \
            /work/assets/coverage.svg \
            /work/coverage/coverage-summary.md

      - name: Validate Coverage Threshold
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          tree = ET.parse('coverage/merged/kcov-merged/cobertura.xml')
          root = tree.getroot()
          line_rate = float(root.get('line-rate', '0'))
          if line_rate < 0.90:
              raise SystemExit(f'Coverage threshold failed: {line_rate * 100:.2f}% < 90%')
          print(f'Coverage threshold validated: {line_rate * 100:.2f}%')
          PY

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        with:
          recreate: true
          path: coverage/coverage-summary.md

      - name: Write to Job Summary
        run: cat coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Coverage For SonarQube Cloud
        run: |
          # kcov records container-absolute paths; Sonar needs repo-relative ones.
          sed -i 's#path="/app/#path="#g' coverage/merged/kcov-merged/sonarqube.xml

      - name: Upload Sonar Coverage Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sonar-coverage
          path: coverage/merged/kcov-merged/sonarqube.xml
          retention-days: 1

  sonarqube:
    name: SonarQube Cloud Analysis
    needs: report-coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          # Full history lets SonarQube Cloud assign blame and new-code periods.
          fetch-depth: 0
          persist-credentials: false

      - name: Download Sonar Coverage Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: sonar-coverage
          path: coverage/merged/kcov-merged

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
