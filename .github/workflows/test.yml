name: Run Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  lint:
    name: Run Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Install YamlLint
        run: pip install yamllint

      - name: Fix Script Permissions
        run: chmod +x tests/run_tests.sh

      - name: Run ShellCheck
        run: ./tests/run_tests.sh shellcheck

      - name: Run YamlLint
        run: ./tests/run_tests.sh yamllint

  build-and-test:
    name: Build & Test (${{ matrix.base_image }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base_image: ["debian:bookworm-slim", "debian:testing-slim"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.base_image }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.base_image }}-

      - name: Create Sanitized Tag
        id: meta
        run: |
          TAG_NAME=$(echo "${{ matrix.base_image }}" | tr ':' '-')
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/Dockerfile
          build-args: BASE_IMAGE=${{ matrix.base_image }}
          tags: ha-updater-test:${{ steps.meta.outputs.tag_name }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix to prevent cache growth
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Matrix Tests
        run: |
          mkdir -p coverage/${{ steps.meta.outputs.tag_name }}
          docker run --rm -v ${{ github.workspace }}/coverage/${{ steps.meta.outputs.tag_name }}:/app/coverage ha-updater-test:${{ steps.meta.outputs.tag_name }} /app/tests/run_tests.sh coverage unit
          docker run --rm -v ${{ github.workspace }}/coverage/${{ steps.meta.outputs.tag_name }}:/app/coverage ha-updater-test:${{ steps.meta.outputs.tag_name }} /app/tests/run_tests.sh coverage component
          docker run --rm -v ${{ github.workspace }}/coverage/${{ steps.meta.outputs.tag_name }}:/app/coverage ha-updater-test:${{ steps.meta.outputs.tag_name }} /app/tests/run_tests.sh coverage e2e

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ steps.meta.outputs.tag_name }}
          path: coverage/${{ steps.meta.outputs.tag_name }}
          retention-days: 1

      - name: Write Matrix Manifest
        run: |
          mkdir -p coverage-manifest
          cat <<EOF > coverage-manifest/${{ steps.meta.outputs.tag_name }}.json
          {
            "base_image": "${{ matrix.base_image }}",
            "tag_name": "${{ steps.meta.outputs.tag_name }}"
          }
          EOF

      - name: Upload Matrix Manifest
        uses: actions/upload-artifact@v6
        with:
          name: matrix-manifest-${{ steps.meta.outputs.tag_name }}
          path: coverage-manifest/${{ steps.meta.outputs.tag_name }}.json
          retention-days: 1

  report-coverage:
    name: Merge Coverage & Publish Reports
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download Matrix Manifests
        uses: actions/download-artifact@v6
        with:
          pattern: matrix-manifest-*
          path: coverage-manifest
          merge-multiple: true

      - name: Select Merge Image
        id: merge-image
        run: |
          MANIFEST_FILE=$(find coverage-manifest -type f -name '*.json' | sort | head -n1)
          if [ -z "$MANIFEST_FILE" ]; then
            echo "No matrix manifest files found" >&2
            exit 1
          fi

          BASE_IMAGE=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['base_image'])" "$MANIFEST_FILE")
          TAG_NAME=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['tag_name'])" "$MANIFEST_FILE")

          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.merge-image.outputs.tag_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ steps.merge-image.outputs.tag_name }}-

      - name: Build Merge Image (Cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/Dockerfile
          build-args: BASE_IMAGE=${{ steps.merge-image.outputs.base_image }}
          tags: ha-updater-test:${{ steps.merge-image.outputs.tag_name }}
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: false

      - name: Merge Coverage
        run: |
          mkdir -p coverage/merged

          MERGE_INPUTS=$(find coverage -mindepth 2 -maxdepth 2 -type d \( -name unit -o -name component -o -name e2e \) | sed 's#^coverage#/work/coverage#' | sort | tr '\n' ' ')
          if [ -z "$MERGE_INPUTS" ]; then
            echo "No coverage inputs found to merge" >&2
            exit 1
          fi

          docker run --rm \
            -v ${{ github.workspace }}:/work \
            ha-updater-test:${{ steps.merge-image.outputs.tag_name }} \
            bash -lc "kcov --merge /work/coverage/merged $MERGE_INPUTS"
          sudo chown -R $(id -u):$(id -g) coverage/merged

      - name: Fix Coverage XML
        run: |
          python3 tests/transform_coverage.py coverage/merged/kcov-merged/cobertura.xml

      - name: Publish Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/merged/**/cobertura.xml
          badge: false
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '90 100'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
