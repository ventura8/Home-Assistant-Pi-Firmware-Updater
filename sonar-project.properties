# SonarQube Cloud configuration
# Docs: https://docs.sonarsource.com/sonarqube-cloud/
sonar.organization=ventura8
sonar.projectKey=ventura8_Home-Assistant-Pi-Firmware-Updater
sonar.projectName=Home Assistant Pi Firmware Updater

# Analysis scope
sonar.sources=custom_components,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=coverage/**,reports/**,assets/**,docs/releases/**
sonar.sourceEncoding=UTF-8

# Shell coverage produced by kcov (Generic Test Coverage format).
# Paths are rewritten to repo-relative by tests/run_tests.sh sonar-prepare.
sonar.coverageReportPaths=coverage/merged/kcov-merged/sonarqube.xml
